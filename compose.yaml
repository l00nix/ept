services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - repo:/usr/share/nginx/html:ro
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  builder:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      INTERVAL: "86400"
      RECIPES_GIT: "https://github.com/sammothxc/ept.git"
      RECIPES_SUBDIR: "recipes"
    volumes:
      - repo:/repo
      - work:/work
      - ./recipes:/recipes:ro

volumes:
  repo:
  work:
