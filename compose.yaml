# docker compose exec builder ept-build once         # check everything now
# docker compose exec builder ept-build once <name>  # force a rebuild of one package
# docker compose exec builder cat /work/log/<name>.log

services:
  ept-web:
    container_name: ept-web
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - ept-edge
    volumes:
      - repo:/usr/share/nginx/html:ro
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ept-builder:
    container_name: ept-builder
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      INTERVAL: 86400
      RECIPES_GIT: https://github.com/sammothxc/ept.git
      RECIPES_SUBDIR: recipes
    volumes:
      - repo:/repo
      - work:/work
      - ./recipes:/recipes:ro

networks:
  ept-edge:
    external: true

volumes:
  repo: null
  work: null
