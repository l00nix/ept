server {
    listen 80 default_server;
    server_name _;

    root /repo;
    autoindex on;
    # Serve every file as binary. With the usual MIME table a .htm file goes
    # out as text/html, and Cloudflare then appends a script to it, which
    # breaks the checksum.
    types { }
    default_type application/octet-stream;

    # ept reads everything as raw bytes over HTTP/1.0
    gzip off;

    location / {
        try_files $uri $uri/ =404;
    }

    # the package lists and VERSION files are text; show them in a browser
    location ~ /(index|VERSION)$ {
        default_type text/plain;
    }
}
